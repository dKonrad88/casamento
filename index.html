<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Casamento</title>
<meta name="theme-color" content="#185FA5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Casamento">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#14110d;--card:#211d17;--card2:#2a251d;--ink:#efe9df;--muted:#a99f8f;--line:#332d24;--primary:#185FA5;--primary2:#1a7a8a;--primary-d:#0d3d6b;--gold:#c9a86a;--ok:#1f9d63;--erro:#d2533f;--radius:14px}
  [data-theme="light"]{--bg:#f4efe7;--card:#fffdf9;--card2:#faf5ec;--ink:#2a241d;--muted:#9a8f7f;--line:#ece2d2;--gold:#b8935a}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Inter',-apple-system,system-ui,sans-serif;background:#05080f;color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:14px}
  .phone{position:relative;display:flex;flex-direction:column;width:min(100%,412px);height:min(94vh,880px);background:var(--bg);border-radius:38px;border:1px solid rgba(255,255,255,.08);overflow:hidden;box-shadow:0 0 0 8px #05080f,0 30px 70px rgba(0,0,0,.6),0 6px 18px rgba(0,0,0,.5)}
  .header{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 15px 12px;background:var(--card);border-bottom:1px solid var(--line)}
  .header .htxt{flex:1;min-width:0}
  .header h1{font-family:'Playfair Display',serif;font-size:1.28rem;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .header p{font-size:.75rem;color:var(--muted);margin-top:1px}
  .hacts{display:flex;gap:8px;flex:0 0 auto;margin-left:auto}
  .hbtn{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:transparent;border:0;color:var(--ink);font-size:1.15rem;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
  .hbtn.back{font-size:1.7rem;padding-bottom:3px}
  .header.home{background:transparent;border-bottom:0;padding-bottom:2px}
  .header.home .htxt{display:none}
  .wrap{flex:1;overflow-y:auto;min-height:0;width:100%;max-width:560px;margin:0 auto;padding:16px 16px 40px;scrollbar-width:none}
  .wrap::-webkit-scrollbar{display:none}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:14px}
  .card h2{font-size:1rem;font-weight:600;margin-bottom:.3rem}
  .grp{font-family:'Playfair Display',serif;font-weight:600;font-size:1.08rem;display:flex;align-items:center;gap:8px;margin:-16px -16px 0;padding:12px 16px;border-radius:14px 14px 0 0;background:rgba(176,137,82,.18)}
  .grp + .sw{border-top:0}
  .cbar{display:flex;gap:8px;align-items:stretch;margin-top:14px}
  .cfilter{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);border-radius:12px;padding:0 12px;font-size:.95rem;font-family:inherit;outline:none;-webkit-appearance:none;appearance:none;height:46px}
  .cfilter:focus{border-color:var(--primary2)}
  .ib2{flex:0 0 auto;width:46px;height:46px;border-radius:12px;background:var(--card2);border:1.5px solid var(--line);color:var(--ink);font-size:1.25rem;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
  .ib2.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .ib2.add{color:var(--primary2);font-size:1.55rem}
  .sub{font-size:.85rem;color:var(--muted)}
  input.f{width:100%;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);border-radius:11px;padding:12px 14px;font-size:1rem;font-family:inherit;outline:none;margin-bottom:10px}
  input.f:focus{border-color:var(--primary2)}
  .btn{width:100%;border:0;background:linear-gradient(135deg,#185FA5,#1a7a8a);color:#fff;border-radius:12px;padding:13px;font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit}
  .btn.soft{background:var(--card2);color:var(--ink);border:1.5px solid var(--line)}
  .btn:disabled{opacity:.6}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:16px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 15px;cursor:pointer;text-align:left;min-height:114px}
  .tile .ic{color:var(--primary2);height:26px}
  .tile .t{font-family:'Playfair Display',serif;font-weight:600;font-size:1.08rem;margin-top:11px;color:var(--ink)}
  .tile .s{font-size:.74rem;color:var(--muted);margin-top:2px}
  .status{font-size:.85rem;margin-top:8px;min-height:1.1em}
  .status.err{color:var(--erro)} .status.ok{color:var(--ok)}
  .modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:60;display:none}
  .modal-bg.open{display:block}
  .modal{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;z-index:61;padding:12px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:85%;overflow:auto}
  .modal .handle{width:42px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 14px}
  .mitem{display:flex;gap:12px;align-items:center;width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;color:var(--ink);font-size:1rem;font-weight:500;cursor:pointer;text-align:left;font-family:inherit}
  .mitem .mic{font-size:1.15rem}
  .code-box{font-size:1.8rem;font-weight:700;letter-spacing:4px;text-align:center;background:var(--card2);border:1px dashed var(--primary2);border-radius:12px;padding:16px;margin:10px 0;color:var(--primary2)}
  .conn{font-size:.85rem;color:var(--muted);margin-top:6px}
  .toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%) translateY(20px);background:#0a0f15;color:#fff;border:1px solid var(--line);padding:11px 18px;border-radius:999px;font-size:.9rem;opacity:0;transition:.25s;z-index:70;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .hero{padding:8px 4px 0}
  .hero .amp{font-family:'Cormorant Garamond',serif;font-size:.98rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
  .hero h1{font-family:'Playfair Display',serif;font-weight:600;font-size:2.05rem;line-height:1.04;color:var(--ink)}
  .hero .date{font-family:'Cormorant Garamond',serif;font-size:1.06rem;color:var(--muted);margin-top:8px;line-height:1.35}
  .cdcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 18px;margin-top:14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
  .cdcard .cdnum{font-family:'Playfair Display',serif;font-size:2rem;color:var(--primary2);line-height:1}
  .cdcard .cdlbl{font-size:.78rem;color:var(--muted);margin-top:3px}
  .rule{height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:17px 3px 2px;opacity:.7}
  select.f{width:100%;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);border-radius:11px;padding:12px 14px;font-size:1rem;font-family:inherit;margin-bottom:10px;outline:none;-webkit-appearance:none;appearance:none}
  select.f:focus{border-color:var(--primary2)}
  label.fl{display:block;font-size:.8rem;color:var(--muted);margin:2px 0 5px}
  /* campo de dinheiro: R$ fixo + máscara de centavos */
  .minp{position:relative}
  .minp > .cur{position:absolute;left:14px;top:12px;color:var(--muted);font-size:1rem;pointer-events:none}
  .minp > input.f{padding-left:42px}
  .row{display:flex;align-items:center;gap:11px;padding:12px 0;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .row .grow,.sw-content .grow{flex:1;min-width:0}
  .row .tt{font-weight:500;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .tt.done{text-decoration:line-through;opacity:.5}
  .row .ms{font-size:.77rem;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ib{border:0;background:transparent;color:var(--muted);font-size:1.15rem;cursor:pointer;padding:6px;border-radius:8px;line-height:1}
  .ib:active{background:var(--card2)}
  .chk{width:24px;height:24px;flex:0 0 auto;border:2px solid var(--line);border-radius:8px;background:var(--card2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:.85rem}
  .chk.on{background:var(--ok);border-color:var(--ok)}
  .tag{font-size:.66rem;padding:2px 8px;border-radius:999px;font-weight:600;white-space:nowrap;flex:0 0 auto}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;display:inline-block}
  .rsvp{display:flex;gap:6px;flex:0 0 auto}
  .rsvp button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card2);color:var(--muted);cursor:pointer;font-size:1rem;line-height:1}
  .rsvp button.yes.on{background:var(--ok);border-color:var(--ok);color:#fff}
  .rsvp button.no.on{background:var(--erro);border-color:var(--erro);color:#fff}
  .sw{position:relative;overflow:hidden;border-top:1px solid var(--line)}
  .sw:first-child{border-top:0}
  .sw-act{position:absolute;top:0;bottom:0;display:flex;align-items:stretch;z-index:0}
  .sw-act.l{left:0}
  .sw-act.r{right:0}
  .sw-act button{border:0;color:#fff;font-size:1.2rem;width:54px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .sw-yes{background:var(--ok)}
  .sw-mb{background:#e0902a}
  .sw-no{background:var(--erro)}
  .sw-del{background:#4a4038}
  .sw-content{position:relative;z-index:1;background:var(--card);display:flex;align-items:center;gap:11px;padding:12px 0;transition:transform .2s ease;touch-action:pan-y;cursor:pointer}
  .sendbtn{flex:0 0 auto;border:0;background:transparent;padding:4px 2px;cursor:pointer;display:flex;align-items:center;line-height:1}
  .crownslot{flex:0 0 auto;width:22px;text-align:center;font-size:1.05rem;line-height:1}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .stat .n{font-size:1.55rem;font-weight:600;line-height:1.1}
  .stat .l{font-size:.74rem;color:var(--muted);margin-top:4px}
  .prog{height:10px;border-radius:999px;background:var(--card2);overflow:hidden;margin-top:10px;border:1px solid var(--line)}
  .prog > i{display:block;height:100%;background:linear-gradient(90deg,#185FA5,#1a7a8a);border-radius:999px;transition:width .4s}
  .cd{display:flex;gap:10px;justify-content:center;text-align:center}
  .cd .b{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px 4px}
  .cd .b .v{font-size:1.8rem;font-weight:700;color:var(--primary2)}
  .cd .b .k{font-size:.7rem;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
  .addbar{display:flex;gap:8px;margin-top:12px}
  .addbar .f{margin-bottom:0}
  .addbar .btn{width:auto;flex:0 0 auto;padding:12px 16px}
  .mini{font-size:.82rem;color:var(--muted)}
  .clsec{border:1px solid var(--line);border-radius:12px;margin-top:12px;overflow:hidden;background:var(--card2)}
  .clsec-h{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;font-weight:600;font-size:.95rem}
  .clsec-h .cnt{margin-left:auto;font-size:.78rem;color:var(--muted);font-weight:400}
  .clsec-b{padding:4px 14px 12px}
  .empty{text-align:center;color:var(--muted);font-size:.9rem;padding:26px 10px}
  .totbar{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .totbar .v{font-size:1.4rem;font-weight:700}
  /* topo editorial (Gastos) */
  .ed{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 4px 0}
  .edlbl{font-family:'Cormorant Garamond',serif;font-size:.92rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
  .edval{font-family:'Playfair Display',serif;font-size:2rem;font-weight:600;line-height:1.05;color:var(--ink);margin-top:2px}
  .edmeta{flex:0 0 auto;text-align:right;cursor:pointer}
  .edmeta .m{font-family:'Playfair Display',serif;font-size:1.05rem;font-weight:600;color:var(--muted);margin-top:2px}
  .progl{height:3px;border-radius:999px;background:var(--line);overflow:hidden;margin:12px 4px 0}
  .progl > i{display:block;height:100%;background:var(--gold);transition:width .4s}
  .figs{display:flex;margin-top:16px}
  .fig{flex:1;min-width:0;padding:0 4px;border-left:1px solid var(--line);text-align:center}
  .fig:first-child{border-left:0}
  .fig .v{font-family:'Playfair Display',serif;font-size:.92rem;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fig .v .c{font-size:.72rem;font-weight:500;color:var(--muted);margin-right:3px}
  .fig .k{font-size:.63rem;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.07em}
  .gsw .tt{font-weight:500;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gsw .tt.done{text-decoration:line-through;opacity:.5}
  .gsw .ms{font-size:.76rem;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .parcbtn{flex:0 0 auto;border:0;background:transparent;color:var(--muted);padding:4px 0 4px 8px;cursor:pointer;display:flex;align-items:center;line-height:1}
  /* painel "o que falta pagar" (expande abaixo da linha do gasto) */
  .gparc{padding:0 0 12px 19px;font-size:.8rem}
  .gparc .pr{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:5px 0}
  .gparc .pr .d{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gparc .pr .v{font-family:'Playfair Display',serif;font-weight:600;flex:0 0 auto}
  .gparc .tot{display:flex;justify-content:space-between;gap:10px;margin-top:4px;padding-top:7px;border-top:1px solid var(--line)}
  .gparc .tot .k{color:var(--muted)}
  .gparc .tot .v{font-family:'Playfair Display',serif;font-weight:600}
  .gparc .pr.ok{opacity:.5}
  .gparc .pr .ck{color:var(--ok);margin-right:4px}
  .gparc .tot.solo{margin-top:0;padding-top:0;border-top:0}
  .gparc .warn{margin-top:7px;font-size:.75rem;line-height:1.35;color:#c99a2e}
  .gval{flex:0 0 auto;text-align:right;line-height:1.3}
  .gval .gv{font-family:'Playfair Display',serif;font-size:1rem;font-weight:600;white-space:nowrap}
  .gval .old{text-decoration:line-through;opacity:.75}
  .sw-pay{background:var(--primary2)}
  .parc{border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--card2)}
  .pf{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:9px 8px;font-size:.85rem;font-family:inherit;outline:none;min-width:0}
  .pf:focus{border-color:var(--primary2)}
  .parc .pl{flex:1 1 100%}
  .parc .pv{flex:1 1 88px}
  .parc .pd{flex:1 1 132px}
  .parc .pk{flex:0 0 auto}
  .parc .ib{flex:0 0 auto;margin-left:auto}
  /* celular/PWA instalado: tira a moldura e ocupa a tela toda */
  @media (max-width:480px),(display-mode:standalone){
    html,body{height:auto}
    body{display:block;padding:0;background:var(--bg);min-height:100dvh}
    .phone{width:100%;max-width:none;height:100dvh;border:0;border-radius:0;box-shadow:none}
  }
  body.standalone{display:block;padding:0;background:var(--bg)}
  body.standalone .phone{width:100%;max-width:none;height:100dvh;border:0;border-radius:0;box-shadow:none}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <button class="hbtn back" id="backBtn" aria-label="Voltar" style="display:none">‹</button>
    <div class="htxt"><h1 id="htitle">Casamento</h1><p id="hsub"></p></div>
    <div class="hacts">
      <button class="hbtn" id="themeBtn" aria-label="Alternar tema">🌙</button>
      <button class="hbtn" id="updBtn" aria-label="Atualizar o app">🔄</button>
      <button class="hbtn" id="cfgBtn" aria-label="Configurações">⚙️</button>
    </div>
  </div>
  <div class="wrap"><div id="app"></div></div>

  <div class="modal-bg" id="cfgBg"></div>
  <div class="modal" id="cfgModal" style="display:none">
    <div class="handle"></div>
    <div id="cfgBody"></div>
  </div>
  <div class="modal-bg" id="fBg"></div>
  <div class="modal" id="fModal" style="display:none">
    <div class="handle"></div>
    <div id="fBody"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  "use strict";
  var SB_URL='https://jlouesrrmqeauzlgvrpw.supabase.co';
  var SB_KEY='sb_publishable_ulG1woVG1p1Seax63GGYPQ_PG6-8l-G';
  var sb=null, user=null, espacoId=null, espacoNome='Casamento', dados={};
  var $=function(s){return document.querySelector(s);};
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  var toastT=null;
  function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2000);}

  /* ---------- tema ---------- */
  function setTheme(t){document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('cas_theme',t);}catch(e){}try{updThemeBtn();}catch(e){}renderCfg();}
  function initTheme(){var t='light';try{t=localStorage.getItem('cas_theme')||'light';}catch(e){}document.documentElement.setAttribute('data-theme',t);}

  /* ---------- atualizar app ---------- */
  async function updateApp(){
    try{toast('Atualizando…');}catch(e){}
    if(!('serviceWorker' in navigator)){location.reload();return;}
    try{
      var reg=await navigator.serviceWorker.getRegistration();
      if(reg){try{await reg.update();}catch(e){}}
      if(reg&&reg.waiting){var done=false;navigator.serviceWorker.addEventListener('controllerchange',function(){if(done)return;done=true;location.reload();});reg.waiting.postMessage({type:'SKIP_WAITING'});setTimeout(function(){if(!done){done=true;location.reload();}},1500);return;}
      if(window.caches){var ks=await caches.keys();await Promise.all(ks.map(function(k){return caches.delete(k);}));}
      location.reload();
    }catch(e){location.reload();}
  }

  /* ---------- supabase ---------- */
  function sbInit(){if(!sb&&window.supabase){try{sb=window.supabase.createClient(SB_URL,SB_KEY);sb.auth.onAuthStateChange(function(_e,sess){user=sess?sess.user:null;if(user){boot();}else{render();}});}catch(e){sb=null;}}return sb;}

  async function sbLogin(){
    sbInit();if(!sb){toast('Sem conexão.');return;}
    var email=($('#loEmail').value||'').trim().toLowerCase(), pass=($('#loPass').value||'');
    if(!email||email.indexOf('@')<1){setStatus('Digite um e-mail válido.','err');return;}
    if(!pass){setStatus('Digite a senha.','err');return;}
    var b=$('#loBtn');if(b){b.disabled=true;b.textContent='entrando…';}
    var r=await sb.auth.signInWithPassword({email:email,password:pass});
    if(r.error){if(b){b.disabled=false;b.textContent='Entrar';}setStatus(/Invalid login/i.test(r.error.message)?'E-mail ou senha incorretos.':('Falha: '+r.error.message),'err');return;}
    user=r.data.user; boot();
  }
  function sbLogout(){ (sb?sb.auth.signOut():Promise.resolve()).then(function(){user=null;espacoId=null;dados={};closeCfg();render();toast('Saiu da conta.');}); }
  function setStatus(m,cls){var s=$('#loStatus');if(s){s.className='status '+(cls||'');s.textContent=m;}}

  /* ---------- espaço (reaproveita o motor do "lista") ---------- */
  async function carregarEspacos(){
    var r=await sb.from('listas').select('id,nome,tipo').eq('tipo','casamento').order('created_at');
    return r.error?[]:(r.data||[]);
  }
  async function criarEspaco(){

  /* ---------- Convidados ---------- */
  var convFilter='all', convBusca='', convSearchOpen=false;
  function convListaHTML(){
    var conv=gConv(),q=(convBusca||'').trim().toLowerCase();
    var isStatus=(convFilter==='confirmado'||convFilter==='pendente'||convFilter==='recusado');
    var isNivel=NIVEIS.some(function(n){return n[0]===convFilter;});
    var list=conv.filter(function(c){
      if(!(convFilter==='all'||(isStatus&&effStatus(c)===convFilter)||(isNivel&&c.nivel===convFilter)||(convFilter==='enviado'&&c.enviado)||(convFilter==='naoenviado'&&!c.enviado)))return false;

        var par=casal?ordenaCasal(c.nome,c.conjuge):[c.nome];

  /* ---------- Gastos (paridade com o HUB: Fechado/Planejando, status, orçado×final, parcelas) ---------- */
  var CAS_STATUS=['Não iniciado','Pesquisando','Contatado','Aguardando retorno','Orçamento recebido','Em negociação','Escolhido','Contratado','Em andamento','Finalizado','Cancelado'];
  function casStatusTipo(s){return ['Contratado','Em andamento','Finalizado'].indexOf(s)>=0?'fechado':'planejado';}
  function gTipoOf(g){return g.tipo==='planejado'?'planejado':'fechado';}
  function casStatusOf(g){return g.statusForn||(gTipoOf(g)==='fechado'?'Contratado':'Não iniciado');}
  function casStatusColor(s){if(s==='Cancelado')return '#d2533f';if(['Contratado','Em andamento','Finalizado'].indexOf(s)>=0)return '#1f9d63';if(['Orçamento recebido','Em negociação','Escolhido'].indexOf(s)>=0)return '#c99a2e';return '#5b6b7d';}
  function gParc(g){return Array.isArray(g.parcelas)?g.parcelas:[];}
  function gPagoAmt(g){var p=gParc(g);if(p.length)return p.filter(function(x){return x.paga;}).reduce(function(s,x){return s+(parseFloat(x.valor)||0);},0);return (g.pago===true||g.status==='pago')?gasVal(g):0;}
  function gStatusOf(g){var p=gParc(g);if(!p.length)return g.status||'apagar';var pago=gPagoAmt(g);if(pago<=0.001)return 'apagar';if(pago>=gasVal(g)-0.001)return 'pago';return 'parcial';}
  function gEco(g){var vi=parseFloat(g.valorIni)||0;return vi>gasVal(g)?vi-gasVal(g):0;}
  function gProxVenc(g){var ds=gParc(g).filter(function(x){return !x.paga&&x.venc;}).map(function(x){return x.venc;}).sort();if(!ds.length)return g.venc||'';return fmtBRc(ds[0])+(ds.length>1?' +'+(ds.length-1):'');}
  function moneyIn(v){return (Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
  // máscara de centavos: só dígitos contam e o valor preenche da direita pra esquerda
  function maskMoney(el){
    var d=(el.value||'').replace(/\D/g,'').replace(/^0+/,'');
    if(!d){el.value='';return;}
    if(d.length>11)d=d.slice(0,11);
    while(d.length<3)d='0'+d;
    el.value=Number(d.slice(0,-2)).toLocaleString('pt-BR')+','+d.slice(-2);
    try{el.setSelectionRange(el.value.length,el.value.length);}catch(e){}
  }
  function addMonthsISO(iso,n){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);if(!m)return iso;var t=new Date(+m[1],(+m[2]-1)+n,1);var last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();var day=Math.min(+m[3],last);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');}
  function curG(id){return gGas().filter(function(x){return String(x.id)===String(id);})[0];}
  function gastosResumo(){
    var ativos=gGas().filter(function(g){return !gasCancel(g);});
    var fechados=ativos.filter(function(g){return gTipoOf(g)==='fechado';});
    var plan=ativos.filter(function(g){return gTipoOf(g)==='planejado';});
    var totalFechado=fechados.reduce(function(s,g){return s+gasVal(g);},0);
    var totalPlan=plan.reduce(function(s,g){return s+(parseFloat(g.valorIni)||gasVal(g));},0);
    var pago=fechados.reduce(function(s,g){return s+gPagoAmt(g);},0);
    // economia só conta negociação real: precisa ter valor final fechado e menor que o orçado
    var economia=ativos.reduce(function(s,g){var vi=parseFloat(g.valorIni)||0,vf=gasVal(g);return s+((vf>0&&vi>vf)?(vi-vf):0);},0);
    return {totalFechado:totalFechado,totalPlan:totalPlan,pago:pago,apagar:totalFechado-pago,projecao:totalFechado+totalPlan,economia:economia,meta:gMeta()};
  }
  var gasFiltro='fechado', gasBusca='', gasSearchOpen=false, gasAberto={};
  function chevSVG(open){return '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate('+(open?180:0)+'deg);transition:transform .2s" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>';}
  // painel read-only do que ainda falta pagar
  function gastoParcelasHTML(g){
    var todas=gParc(g).slice();
    var abertas=todas.filter(function(p){return !p.paga;});
    // o que falta de verdade vem do gasto (valor − pago), não da soma das parcelas:
    // as parcelas lançadas podem não fechar com o total, e aí o painel precisa denunciar
    var faltaReal=gasVal(g)-gPagoAmt(g);
    var somaAbertas=abertas.reduce(function(s,p){return s+(parseFloat(p.valor)||0);},0);
    var descasa=Math.abs(faltaReal-somaAbertas)>0.01;
    var dif=faltaReal-somaAbertas;
    var aviso=descasa
      ? '<div class="warn">⚠ as parcelas lançadas somam '+fmt(Math.abs(dif))+(dif>0?' a menos':' a mais')+' que o total do gasto — toque pra ajustar</div>'
      : '';
    if(!todas.length)
      return '<div class="gparc"><div class="tot solo"><span class="k">Nenhuma parcela lançada</span><span class="v">'+fmt(faltaReal)+'</span></div>'+aviso+'</div>';
    todas.sort(function(a,b){return String(a.venc||'9999').localeCompare(String(b.venc||'9999'));});
    // parcela única em aberto: listar E totalizar repetiria o mesmo número, o que lê como duas cobranças
    if(todas.length===1&&abertas.length===1&&!descasa){
      var u=todas[0],quandoU=u.venc?fmtBR(u.venc):'sem data';
      return '<div class="gparc"><div class="tot solo"><span class="k">Falta 1 parcela · '+esc(quandoU)+'</span><span class="v">'+fmt(faltaReal)+'</span></div></div>';
    }
    // lista TODAS as parcelas — as já pagas ficam com ✓ e esmaecidas, pra ver o histórico junto
    var linhas=todas.map(function(p){
      var quando=p.venc?fmtBR(p.venc):'sem data';
      var nome=(p.label||'').trim();
      return '<div class="pr'+(p.paga?' ok':'')+'"><span class="d">'+(p.paga?'<span class="ck">✓</span>':'')+esc(quando)+(nome?' · '+esc(nome):'')+'</span><span class="v">'+fmt(p.valor||0)+'</span></div>';
    }).join('');
    var rodape=abertas.length
      ? '<span class="k">Falta pagar ('+abertas.length+'x)</span><span class="v">'+fmt(faltaReal)+'</span>'
      : '<span class="k">Tudo pago</span><span class="v">'+fmt(gPagoAmt(g))+'</span>';
    return '<div class="gparc">'+linhas+'<div class="tot">'+rodape+'</div>'+aviso+'</div>';
  }
  function gastosListaHTML(){
    var q=(gasBusca||'').trim().toLowerCase();
    var lista=gGas().filter(function(g){
      if(gasFiltro!=='todos'&&gTipoOf(g)!==gasFiltro)return false;
      if(q){var hay=((g.desc||'')+' '+(g.empresa||g.categoria||'')).toLowerCase();if(hay.indexOf(q)<0)return false;}
      return true;
    });
    lista.sort(function(a,b){return String(a.desc||'').localeCompare(String(b.desc||''),'pt',{sensitivity:'base'});});
    if(!lista.length){
      var emptyTxt=q?('Nenhum gasto encontrado para “'+esc(gasBusca.trim())+'”.'):(gasFiltro==='planejado'?'Nada em planejamento ainda.':gasFiltro==='fechado'?'Nenhum gasto fechado ainda.':'Nenhum gasto lançado.');
      return '<div class="card"><div class="empty">'+emptyTxt+'</div></div>';
    }
    var rows=lista.map(function(g){
      var canc=gasCancel(g),st=casStatusOf(g),tipo=gTipoOf(g);
      var vi=parseFloat(g.valorIni)||0,vf=gasVal(g);
      var realEco=(vf>0&&vi>vf)?(vi-vf):0;
      // planejado: o orçado É o valor (estimativa) — não risca nem mostra "R$ 0,00"
      var right=(tipo==='planejado')
        ? '<div class="gv">'+fmt(vf>0?vf:vi)+'</div>'+(vf>0?'':'<div class="ms">orçado</div>')
        : ((vi>0&&Math.abs(vi-vf)>0.01)?'<div class="ms old">'+fmt(vi)+'</div>':'')+
          '<div class="gv">'+fmt(vf)+'</div>'+
          (realEco>0?'<div class="ms">▼ '+fmt0(realEco)+'</div>':'');
      // em Fechados o status textual é redundante (o dot já diz) — só aparece em Planejando ou se cancelado
      var sub=[];
      if(tipo!=='fechado'||canc)sub.push(esc(st));
      if(g.empresa||g.categoria)sub.push(esc(g.empresa||g.categoria));
      if(tipo==='fechado'){var p=gParc(g);if(p.length)sub.push(p.filter(function(x){return x.paga;}).length+'/'+p.length);var pv=gProxVenc(g);if(pv&&!canc)sub.push('venc '+esc(pv));}
      var pay=(tipo==='fechado'),aberto=!!gasAberto[g.id];
      return '<div class="sw">'+
        (pay?'<div class="sw-act l"><button class="sw-pay" data-act="gpag" data-id="'+g.id+'" aria-label="Pagamentos">💳</button></div>':'')+
        '<div class="sw-act r"><button class="sw-del" data-act="gdel" data-id="'+g.id+'" aria-label="Excluir">🗑</button></div>'+
        '<div class="sw-content gsw" data-act="gedit" data-id="'+g.id+'" data-swl="'+(pay?54:0)+'" data-swr="-54">'+
          '<span class="dot" style="background:'+casStatusColor(st)+'"></span>'+
          '<div class="grow"><div class="tt'+(canc?' done':'')+'">'+esc(g.desc||'(sem descrição)')+'</div>'+
            '<div class="ms">'+sub.join(' · ')+'</div></div>'+
          '<div class="gval">'+right+'</div>'+
          (pay?'<button class="parcbtn" data-act="gtogp" data-id="'+g.id+'" aria-expanded="'+aberto+'" aria-label="O que falta pagar">'+chevSVG(aberto)+'</button>':'')+
        '</div></div>'+
        (pay&&aberto?gastoParcelasHTML(g):'');
    }).join('');
    var titulo=gasFiltro==='fechado'?'Fechados':gasFiltro==='planejado'?'Planejando':'Todos os gastos';
    return '<div class="card"><h2 class="grp">'+titulo+' <span class="mini" style="font-weight:400">('+lista.length+')</span></h2>'+rows+'</div>';
  }

        '<div class="edmeta" data-act="gmeta"><div class="mini">Meta</div><div class="m">'+(meta>0?fmt0(meta):'definir')+'</div></div></div>'+
      '<div class="progl"><i style="width:'+pct+'%"></i></div>'+

      (gasSearchOpen?'<input class="f" id="gasBuscaInput" type="search" autocapitalize="off" autocorrect="off" placeholder="Buscar por nome ou fornecedor…" value="'+esc(gasBusca)+'" style="margin:10px 0 0">':'')+
      '<div id="gasList">'+gastosListaHTML()+'</div>';

  function formGasto(g){
    g=g||{};
    var cur=g.id?casStatusOf(g):'Não iniciado';

  /* ---------- swipe (linhas de Convidados e Gastos; limites por linha via data-swl/data-swr) ---------- */
  var SW_L=162, SW_R=-54;
  var swEl=null,swX0=0,swY0=0,swBase=0,swDrag=false,swOpen=null,swSuppress=false,swLcur=SW_L,swRcur=SW_R;
  function swLim(el,attr,def){var n=parseInt(el.getAttribute(attr));return isNaN(n)?def:n;}
  function swClose(el){if(el&&el.style){el.style.transition='';el.style.transform='';el._sw=0;}}
  function swDown(e){
    if(e.target.closest&&e.target.closest('.sw-act'))return;
    var c=e.target.closest&&e.target.closest('.sw-content');if(!c)return;
    if(swOpen&&swOpen!==c)swClose(swOpen);
    swEl=c;swX0=e.clientX;swY0=e.clientY;swBase=c._sw||0;swDrag=false;
    swLcur=swLim(c,'data-swl',SW_L);swRcur=swLim(c,'data-swr',SW_R);
  }
  function swMove(e){
    if(!swEl)return;
    var dx=e.clientX-swX0,dy=e.clientY-swY0;
    if(!swDrag){
      if(Math.abs(dy)>10&&Math.abs(dy)>=Math.abs(dx)){swEl=null;return;}
      if(Math.abs(dx)>10)swDrag=true;else return;
    }
    if(e.cancelable)e.preventDefault();
    var v=Math.max(swRcur-8,Math.min(swLcur+8,swBase+dx));
    swEl.style.transition='none';swEl.style.transform='translateX('+v+'px)';
  }
  function swUp(e){
    if(!swEl)return;var el=swEl;swEl=null;el.style.transition='';
    if(!swDrag){
      if((el._sw||0)!==0){swClose(el);swOpen=null;swSuppress=true;setTimeout(function(){swSuppress=false;},400);}
      return;
    }
    var v=swBase+(e.clientX-swX0);
    if(swLcur>0&&v>swLcur*0.52){el.style.transform='translateX('+swLcur+'px)';el._sw=swLcur;swOpen=el;}
    else if(swRcur<0&&v<swRcur*0.55){el.style.transform='translateX('+swRcur+'px)';el._sw=swRcur;swOpen=el;}
    else{el.style.transform='';el._sw=0;if(swOpen===el)swOpen=null;}
    swSuppress=true;setTimeout(function(){swSuppress=false;},400);
  }

    if(act==='gsearch'){gasSearchOpen=!gasSearchOpen;if(!gasSearchOpen)gasBusca='';render();if(gasSearchOpen){var gsi=$('#gasBuscaInput');if(gsi)gsi.focus();}return;}
    if(act==='gdel'){if(confirm('Excluir gasto?')){save('gastos',gGas().filter(function(x){return String(x.id)!==String(id);}));closeForm();render();}return;}

    // gastos — pagamentos / parcelas
    if(act==='gpag'){formPagamento(id);return;}

    if(act==='gprem'){var pr=el.closest('.parc');if(pr&&pr.parentNode){pr.parentNode.removeChild(pr);gpCalc();}return;}

    if(act==='cldi'){var cl5=gChk();var s5=cl5.sections.filter(function(x){return x.id===sid;})[0];if(s5){s5.items=(s5.items||[]).filter(function(x){return x.id!==iid;});save('checklist',cl5);render();}return;}
    if(act==='cli'){var cl6=gChk();var s6=cl6.sections.filter(function(x){return x.id===sid;})[0];var i6=s6&&(s6.items||[]).filter(function(x){return x.id===iid;})[0];if(i6){var nv=prompt('Editar item:',i6.text);if(nv!==null){nv=nv.trim();if(nv){i6.text=nv;save('checklist',cl6);render();}}}return;}
    if(act==='clai'){var inp=$('#cli-'+CSS.escape(sid));var txt=inp?(inp.value||'').trim():'';if(!txt)return;var cl7=gChk();var s7=cl7.sections.filter(function(x){return x.id===sid;})[0];if(s7){(s7.items=s7.items||[]).push({id:'ci'+nid(),text:txt,done:false});save('checklist',cl7);render();}return;}
    // form chk toggles
    if(act==='chktog'){var on=el.getAttribute('data-on')==='1';el.setAttribute('data-on',on?'0':'1');el.classList.toggle('on',!on);el.textContent=on?'':'✓';return;}

  document.addEventListener('pointermove',swMove,{passive:false});
  document.addEventListener('pointerup',swUp);
  document.addEventListener('pointercancel',function(){if(swEl){swEl.style.transition='';swEl.style.transform=(swEl._sw?'translateX('+swEl._sw+'px)':'');swEl=null;}});
  document.addEventListener('click',function(e){if(swSuppress){if(e.target.closest&&e.target.closest('.sw-content')){e.stopPropagation();e.preventDefault();}swSuppress=false;}},true);
  document.addEventListener('input',function(e){
    if(!e.target)return;
    if(e.target.classList&&e.target.classList.contains('money')){
      maskMoney(e.target);
      if(e.target.closest&&e.target.closest('#parcWrap'))gpCalc(); // parcelas recalculam a soma ao vivo
      return;
    }
    if(e.target.id==='gasBuscaInput'){gasBusca=e.target.value;var el=document.getElementById('gasList');if(el)el.innerHTML=gastosListaHTML();return;}
    if(e.target.id==='gasFilterSel'){gasFiltro=e.target.value;var egf=document.getElementById('gasList');if(egf)egf.innerHTML=gastosListaHTML();return;}
    if(e.target.id==='convBuscaInput'){convBusca=e.target.value;var ecl=document.getElementById('convList');if(ecl)ecl.innerHTML=convListaHTML();return;}
    if(e.target.id==='convFilterSel'){convFilter=e.target.value;var ecf=document.getElementById('convList');if(ecf)ecf.innerHTML=convListaHTML();return;}
    if(e.target.id==='clinkBuscaInput'){clinkBusca=e.target.value;var eck=document.getElementById('clinkList');if(eck)eck.innerHTML=clinkRowsHTML();return;}
    if(e.target.closest&&e.target.closest('#parcWrap'))gpCalc();
  });
  document.addEventListener('change',function(e){
    if(e.target&&e.target.id==='convFilterSel'){convFilter=e.target.value;var el=document.getElementById('convList');if(el)el.innerHTML=convListaHTML();}
    if(e.target&&e.target.id==='gasFilterSel'){gasFiltro=e.target.value;var elg=document.getElementById('gasList');if(elg)elg.innerHTML=gastosListaHTML();}
  });
  sbInit();
  if(sb){sb.auth.getSession().then(function(s){user=(s&&s.data&&s.data.session)?s.data.session.user:null;boot();});}else{render();}

  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){});});}
})();
</script>
</body>
</html>
